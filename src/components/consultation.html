<!-- Shared template: consultation. Content values come from src/data/pages at build time. -->
<section data-consultation id="consultation" class="site-consultation w-full bg-[#D3EAFF] py-7 sm:py-8 lg:py-9">
    <div class="mx-auto w-full max-w-[1320px] px-4 sm:px-6 lg:px-8 site-frame">
        <div
            class="hidden min-[1180px]:grid min-[1180px]:grid-cols-[420px_minmax(0,1fr)] min-[1180px]:items-center min-[1180px]:gap-12 xl:grid-cols-[460px_minmax(0,1fr)] xl:gap-16 [direction:ltr]"
        >
            <form class="grid grid-cols-2 gap-x-2 gap-y-2 [direction:rtl]" data-pending-form>
                <div>
                    <label class="sr-only" for="consultation-name">نام و نام خانوادگی</label>
                    <input
                        id="consultation-name"
                        type="text"
                        name="name"
                        autocomplete="name"
                        placeholder="نام و نام خانوادگی"
                        class="h-[40px] w-full rounded-full border border-brand-blue bg-transparent px-5 text-center text-[14px] text-text-dark outline-none placeholder:text-text-dark/45 transition-colors focus:bg-white/10 xl:h-[44px] xl:text-[14px]"
                    />
                </div>

                <div>
                    <label class="sr-only" for="consultation-email">آدرس ایمیل</label>
                    <input
                        id="consultation-email"
                        type="email"
                        name="email"
                        autocomplete="email"
                        placeholder="آدرس ایمیل"
                        class="h-[40px] w-full rounded-full border border-brand-blue bg-transparent px-5 text-center text-[14px] text-text-dark outline-none placeholder:text-text-dark/45 transition-colors focus:bg-white/10 xl:h-[44px] xl:text-[14px]"
                    />
                </div>

                <div class="relative col-span-2">
                    <label class="sr-only" for="consultation-description">توضیحات پروژه</label>
                    <input
                        id="consultation-description"
                        type="text"
                        name="description"
                        placeholder="توضیحات پروژه"
                        class="h-[40px] w-full rounded-full border border-brand-blue bg-transparent pr-5 pl-14 text-center text-[14px] text-text-dark outline-none placeholder:text-text-dark/45 transition-colors focus:bg-white/10 xl:h-[44px] xl:text-[14px]"
                    />
                    <button
                        type="submit"
                        class="absolute left-3 top-1/2 flex size-8 -translate-y-1/2 items-center justify-center transition-transform hover:scale-105"
                        aria-label="ارسال درخواست"
                    >
                        <img
                            src="/assets/icons/form/send.svg"
                            alt=""
                            class="h-[17px] w-[23px] object-contain xl:h-[18px] xl:w-[24px]"
                        />
                    </button>
                </div>
            </form>

            <div class="text-right [direction:rtl] site-consultation__content">
                <h2 class="text-[22px] font-medium leading-[1.7] text-text-dark xl:text-[24px]"
                    >{{title}} <span class="text-brand-orange">{{accent}}</span></h2
                >
                <p class="mt-3 text-[14px] font-normal leading-[2] text-text-dark xl:text-[14px] site-prose"
                    >{{description}}</p
                >
                <p class="mt-2 text-[14px] font-normal leading-[1.9] text-text-dark/55 xl:text-[14px]"
                    >{{{benefits}}}</p
                >
            </div>
        </div>

        <div class="min-[1180px]:hidden">
            <div class="site-consultation__copy site-consultation__content text-center [direction:rtl]">
                <h2 class="text-[19px] font-medium leading-[1.8] text-text-dark sm:text-[22px] md:text-[24px]"
                    >{{title}} <span class="text-brand-orange">{{accent}}</span></h2
                >
                <p
                    class="mt-3 max-w-[540px] text-[14px] font-normal leading-[2] text-text-dark sm:text-[14px] md:text-[14px] site-prose"
                    >{{description}}</p
                >
                <p class="mt-2 max-w-[520px] text-[14px] leading-[1.9] text-text-dark/50 sm:text-[14px] md:text-[14px]"
                    >{{{benefits}}}</p
                >
            </div>

            <form
                class="site-consultation__mobile-form mx-auto mt-5 grid w-full max-w-[550px] grid-cols-2 gap-x-2 gap-y-2 text-right [direction:rtl] sm:mt-6"
                data-pending-form
            >
                <div class="min-w-0">
                    <label class="sr-only" for="mobile-consultation-name">نام و نام خانوادگی</label>
                    <input
                        id="mobile-consultation-name"
                        type="text"
                        name="name"
                        autocomplete="name"
                        placeholder="نام و نام خانوادگی"
                        class="h-[38px] min-w-0 w-full rounded-full border border-brand-blue bg-transparent px-3 text-right text-[14px] text-text-dark outline-none placeholder:text-text-dark/45 transition-colors focus:bg-white/10 sm:h-[42px] sm:px-4 sm:text-[14px] md:h-[44px] md:px-5 md:text-[14px]"
                    />
                </div>

                <div class="min-w-0">
                    <label class="sr-only" for="mobile-consultation-email">آدرس ایمیل</label>
                    <input
                        id="mobile-consultation-email"
                        type="email"
                        name="email"
                        autocomplete="email"
                        placeholder="آدرس ایمیل"
                        class="h-[38px] min-w-0 w-full rounded-full border border-brand-blue bg-transparent px-3 text-right text-[14px] text-text-dark outline-none placeholder:text-text-dark/45 transition-colors focus:bg-white/10 sm:h-[42px] sm:px-4 sm:text-[14px] md:h-[44px] md:px-5 md:text-[14px]"
                    />
                </div>

                <div class="relative col-span-2">
                    <label class="sr-only" for="mobile-consultation-description">توضیحات پروژه</label>
                    <input
                        id="mobile-consultation-description"
                        type="text"
                        name="description"
                        placeholder="توضیحات پروژه"
                        class="h-[38px] w-full rounded-full border border-brand-blue bg-transparent pr-4 pl-12 text-right text-[14px] text-text-dark outline-none placeholder:text-text-dark/45 transition-colors focus:bg-white/10 sm:h-[42px] sm:pr-5 sm:pl-14 sm:text-[14px] md:h-[44px] md:text-[14px]"
                    />
                    <button
                        type="submit"
                        class="absolute left-2 top-1/2 flex size-8 -translate-y-1/2 items-center justify-center sm:left-3"
                        aria-label="ارسال درخواست"
                    >
                        <img
                            src="/assets/icons/form/send.svg"
                            alt=""
                            class="h-[15px] w-[21px] object-contain sm:h-[17px] sm:w-[23px] md:h-[18px] md:w-[24px]"
                        />
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
