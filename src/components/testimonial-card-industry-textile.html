<!-- Shared template: testimonial-card-industry-textile. Content values come from src/data/pages at build time. -->
<article class="industry-textile__testimonial-card site-card site-testimonial">

    <p class="site-card__description">{{quote}}</p>
    <div class="industry-textile__testimonial-footer">
        <div><strong class="site-card__title">{{name}}</strong><span>{{role}}</span></div>
        <div class="industry-textile__rating" aria-label="۵ از ۵ ستاره">★★★★★</div>
    </div>
</article>
